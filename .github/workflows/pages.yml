name: Deploy documentation

on:
  push:
    branches:
      - main
      - development
    paths:
      - docs/**
      - assets/pype_wordmark.png
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - name: Prepare site
        run: |
          mkdir _site
          cp -R docs/. _site/
          mkdir -p _site/assets
          cp assets/pype_wordmark.png _site/assets/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
